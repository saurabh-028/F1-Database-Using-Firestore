<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Driver | F1 Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <style>
        .driver-form-container {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('/static/images/f1-track.jpg') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            color: white;
            padding: 2rem 0;
        }
        
        .driver-form {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.9);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(231, 6, 0, 0.5);
            border-top: 4px solid #E10600;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .form-header h1 {
            font-weight: bold;
            color: #E10600;
        }
        
        .form-header::after {
            content: '';
            display: block;
            width: 100px;
            height: 3px;
            background: #E10600;
            margin: 10px auto;
        }
        
        .form-label {
            font-weight: 600;
            color: #E10600;
        }
        
        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            color: white;
        }
        
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #E10600;
            box-shadow: 0 0 0 0.25rem rgba(225, 6, 0, 0.25);
            color: white;
        }
        
        .btn-f1 {
            background-color: #E10600;
            color: white;
            font-weight: bold;
            padding: 10px 25px;
            border: none;
            transition: all 0.3s;
        }
        
        .btn-f1:hover {
            background-color: #c00500;
            transform: translateY(-2px);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="driver-form-container">
    <div class="container">
        <div class="driver-form">
            <div class="form-header">
                <h1><i class="fas fa-user-plus me-2"></i>Add New Driver</h1>
                <p class="text-muted">Register a new F1 driver to the database</p>
            </div>
            
            <form method="post" action="/add-driver">
                <div class="form-grid">
                    <!-- Column 1 -->
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g. Max Verstappen">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="age" required min="18" max="50">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Team</label>
                        <input type="text" class="form-control" name="team" required placeholder="e.g. Red Bull Racing">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Championship Points</label>
                        <input type="number" class="form-control" name="points" required min="0">
                    </div>
                    
                    <!-- Column 2 -->
                    <div class="form-group">
                        <label class="form-label">Pole Positions</label>
                        <input type="number" class="form-control" name="pole_positions" required min="0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Race Wins</label>
                        <input type="number" class="form-control" name="race_wins" required min="0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">World Championships</label>
                        <input type="number" class="form-control" name="world_titles" required min="0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Fastest Laps</label>
                        <input type="number" class="form-control" name="fastest_laps" required min="0">
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-f1 btn-lg">
                        <i class="fas fa-save me-2"></i>Add Driver
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
