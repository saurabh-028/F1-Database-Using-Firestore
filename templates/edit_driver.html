<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ driver.name }} | F1 Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <style>
        .driver-form-container {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('/static/images/f1-track.jpg') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            color: white;
            padding: 2rem 0;
        }
        
        .driver-form {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.9);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(231, 6, 0, 0.5);
            border-top: 4px solid #E10600;
        }
    </style>
</head>
<body class="driver-form-container">
    <div class="container">
        <div class="driver-form">
            <div class="form-header">
                <h1><i class="fas fa-user-edit me-2"></i>Edit {{ driver.name }}</h1>
                <p class="text-muted">Update driver information</p>
            </div>
            
            <form method="post" action="/update-driver/{{ driver.name }}">
                <div class="form-grid">
                    <!-- Column 1 -->
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ driver.name }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="age" value="{{ driver.age }}" required min="18" max="50">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Team</label>
                        <select class="form-select" name="team" required>
                            {% for team in teams %}
                            <option value="{{ team }}" {% if team == driver.team %}selected{% endif %}>{{ team }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Championship Points</label>
                        <input type="number" class="form-control" name="points" value="{{ driver.total_points_scored }}" required min="0">
                    </div>
                    
                    <!-- Column 2 -->
                    <div class="form-group">
                        <label class="form-label">Pole Positions</label>
                        <input type="number" class="form-control" name="pole_positions" value="{{ driver.total_pole_positions }}" required min="0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Race Wins</label>
                        <input type="number" class="form-control" name="race_wins" value="{{ driver.total_race_wins }}" required min="0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">World Championships</label>
                        <input type="number" class="form-control" name="world_titles" value="{{ driver.total_world_titles }}" required min="0">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Fastest Laps</label>
                        <input type="number" class="form-control" name="fastest_laps" value="{{ driver.total_fastest_laps }}" required min="0">
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-danger btn-lg me-3">
                        <i class="fas fa-save me-2"></i>Update Driver
                    </button>
                    <a href="/driver/{{ driver.name }}" class="btn btn-secondary btn-lg">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
