<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Teams | F1 Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body class="f1-dashboard">
    {% include "public_navbar.html" %}

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="display-4 fw-bold">
                    <i class="fas fa-search me-2"></i>Query Teams
                </h1>
                <p class="lead">Find teams based on specific criteria</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card bg-dark text-white mb-4">
                    <div class="card-header bg-danger">
                        <h4><i class="fas fa-filter me-2"></i>Search Criteria</h4>
                    </div>
                    <div class="card-body">
                        <form method="post" action="/query-teams">
                            <div class="mb-3">
                                <label class="form-label">Attribute</label>
                                <select class="form-select" name="attribute" required>
                                    <option value="year_founded" {% if form_data and form_data.attribute == 'year_founded' %}selected{% endif %}>Year Founded</option>
                                    <option value="total_pole_positions" {% if form_data and form_data.attribute == 'total_pole_positions' %}selected{% endif %}>Total Pole Positions</option>
                                    <option value="total_race_wins" {% if form_data and form_data.attribute == 'total_race_wins' %}selected{% endif %}>Total Race Wins</option>
                                    <option value="total_constructor_titles" {% if form_data and form_data.attribute == 'total_constructor_titles' %}selected{% endif %}>Constructor Titles</option>
                                    <option value="previous_season_position" {% if form_data and form_data.attribute == 'previous_season_position' %}selected{% endif %}>Previous Season Position</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Operator</label>
                                <select class="form-select" name="operator" required>
                                    <option value="eq" {% if form_data and form_data.operator == 'eq' %}selected{% endif %}>= (Equal To)</option>
                                    <option value="lt" {% if form_data and form_data.operator == 'lt' %}selected{% endif %}>&lt; (Less Than)</option>
                                    <option value="gt" {% if form_data and form_data.operator == 'gt' %}selected{% endif %}>&gt; (Greater Than)</option>
                                    <option value="lte" {% if form_data and form_data.operator == 'lte' %}selected{% endif %}>&le; (Less Than or Equal)</option>
                                    <option value="gte" {% if form_data and form_data.operator == 'gte' %}selected{% endif %}>&ge; (Greater Than or Equal)</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Value</label>
                                <input type="text" class="form-control" name="value" required 
                                    value="{% if form_data %}{{ form_data.value }}{% endif %}">
                            </div>
                            
                            <button type="submit" class="btn btn-danger w-100">
                                <i class="fas fa-search me-1"></i> Query Teams
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
